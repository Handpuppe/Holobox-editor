name: Deploy GitHub Pages

# Publiceert ALLEEN dist/ (gebouwde editor). Nooit de bron-index.html met /src/*.tsx.
# Settings → Pages → Source moet "GitHub Actions" zijn, niet "Deploy from a branch".

on:
  push:
    branches: [main, editor-kopie]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install and build
        run: npm ci && npm run build
      - name: Use built editor as the site
        run: node scripts/prepare-pages.mjs
      - name: Show published HTML (must be assets/*.js, never /src/*.tsx)
        run: |
          echo "=== dist/index.html ==="
          cat dist/index.html
          echo "=== dist/assets ==="
          ls -1 dist/assets
          if grep -E '/src/|\.tsx' dist/index.html dist/editor.html dist/404.html; then
            echo "FOUT: gebouwde HTML wijst nog naar bronbestanden."
            exit 1
          fi
          grep -q '/Holobox-editor/assets/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
