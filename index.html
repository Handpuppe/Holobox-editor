<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Holobox-training: intakeoefening met een fictieve cliënt met afasie na een beroerte."
    />
    <title>Holobox Zorgsimulator</title>
    <style>
      html,
      body,
      #root {
        background: #ffffff;
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var host = location.hostname;
        if (host !== '127.0.0.1' && host !== 'localhost') return;
        var left = 40;
        function ping() {
          fetch('/Holobox-editor/editor-api/editor-alive', { method: 'POST' }).catch(function () {});
        }
        ping();
        var timer = setInterval(function () {
          left -= 1;
          if (left <= 0) {
            clearInterval(timer);
            return;
          }
          ping();
        }, 400);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
